name: Validate policy MCP servers

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - ecfr-mcp
          - federal-register-mcp
          - regulations-gov-mcp
          - acquisition-gov-mcp
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        working-directory: servers/${{ matrix.server }}
        run: uv sync --group dev

      - name: Run tests
        working-directory: servers/${{ matrix.server }}
        run: uv run pytest -q
