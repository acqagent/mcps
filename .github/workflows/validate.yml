name: Validate policy MCP servers

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - ecfr-mcp
          - federal-register-mcp
          - regulations-gov-mcp
          - acquisition-gov-mcp
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        working-directory: servers/${{ matrix.server }}
        run: uv sync --group dev

      - name: Run tests
        working-directory: servers/${{ matrix.server }}
        run: uv run pytest -q

  gao-protests-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/gao-protests-mcp
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servers/gao-protests-mcp/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test Worker (unit, MCP protocol, workerd)
        run: npm test

      - name: Test bundle builder
        run: uv run --with pytest --with numpy pytest scripts -q
